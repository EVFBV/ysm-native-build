name: Build ysm.dll (Windows)

# 目标：在 GitHub 托管的 Windows runner 上构建 YSM 的 native 库（ysm.dll），
# 产物用于打进模组 JAR，使玩家在 Windows 上开箱即用。
#
# 说明：
#  - 本仓库只包含 CI 与脚本，不含任何私有源码；构建对象是公开仓库
#    YesSteveModel/YesSteveModel-Native。
#  - 官方 Windows 工具链是 clang-cl + lld；这里使用 runner 自带的 MSVC
#    （项目的 core headers 已有 _MSC_VER 分支），只需为 gfx 中 2 处
#    clang 专有的空 asm 编译器屏障补上 MSVC 分支。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  CACHE_PREFIX: conan-win-v2

jobs:
  build-windows-native:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: 诊断：runner 环境
        shell: pwsh
        run: |
          Write-Host "== git ==";    git --version
          Write-Host "== python =="; python --version
          Write-Host "== cmake ==";  cmake --version | Select-Object -First 1
          Write-Host "== ninja ==";  ninja --version
          Write-Host "== cl ==";     (Get-Command cl -ErrorAction SilentlyContinue).Source
          Write-Host "== nasm ==";   (Get-Command nasm -ErrorAction SilentlyContinue).Source
          Write-Host "== yasm ==";   (Get-Command yasm -ErrorAction SilentlyContinue).Source

      - name: 校验 Git 版本（必须 >= 2.49）
        shell: pwsh
        run: |
          $raw = (git --version)
          Write-Host $raw
          $v = [version]([regex]::Match($raw, '(\d+\.\d+(\.\d+)?)').Value)
          if ($v -lt [version]"2.49") {
            throw "Git $v 过低：native 配方使用 git clone --revision，需要 >= 2.49"
          }

      - name: 启用 MSVC x64 工具链
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认 MSVC 可用
        shell: pwsh
        run: |
          where.exe cl
          cl 2>&1 | Select-Object -First 3

      - name: 准备 NASM（并移除 Yasm）
        shell: pwsh
        run: |
          # GitHub runner 自带 yasm；native 文档要求 PATH 中不能有 Yasm。
          # runner 是一次性的，这里直接移除它，而不是中断构建。
          $yasm = Get-Command yasm -ErrorAction SilentlyContinue
          if ($yasm) {
            Write-Host "发现 Yasm：$($yasm.Source)，移除"
            try {
              Remove-Item -LiteralPath $yasm.Source -Force -ErrorAction Stop
            } catch {
              Rename-Item -LiteralPath $yasm.Source -NewName "yasm.disabled" -Force
            }
          }
          if (Get-Command yasm -ErrorAction SilentlyContinue) { throw "Yasm 仍在 PATH 中" }
          Write-Host "Yasm: 已移除"

          # NASM：缺失则用 Chocolatey 安装
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            Write-Host "NASM 缺失，用 Chocolatey 安装"
            choco install nasm -y --no-progress
          }
          $nasmDir = "C:\Program Files\NASM"
          if (Test-Path (Join-Path $nasmDir "nasm.exe")) {
            $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append
            $env:Path = "$nasmDir;" + $env:Path
          }
          nasm -v
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { throw "NASM 不可用" }

      - name: 安装 Conan（>= 2.28）
        shell: pwsh
        run: |
          python -m pip install --upgrade "conan>=2.28"
          conan --version

      - name: 克隆 native 仓库（上游原始源码）
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/YesSteveModel/YesSteveModel-Native
          Get-ChildItem YesSteveModel-Native | Select-Object -First 12 Name

      - name: 适配 MSVC：替换 clang 专有的编译器屏障
        shell: pwsh
        run: |
          # gfx 里有 2 处 GCC/Clang 风格的空 asm 编译器屏障，MSVC 不支持该语法
          # （error C2059）。项目的 core headers 本就有 _MSC_VER 分支，说明 MSVC
          # 是被支持的，这里为这 2 处补上等价分支。
          # 另 2 处 asm 位于 #ifdef YSM_ANDROID 的 AArch64 分支，Windows 下不编译。
          $old1 = 'asm volatile("" : "+x"(table_low), "+x"(table_high));'
          $new1 = (@(
            '#if defined(_MSC_VER) && !defined(__clang__)',
            '    _ReadWriteBarrier();',
            '#else',
            '    asm volatile("" : "+x"(table_low), "+x"(table_high));',
            '#endif'
          ) -join "`n")

          $old2 = 'asm volatile("" : "+r"(back_face_bits));'
          $new2 = (@(
            '#if defined(_MSC_VER) && !defined(__clang__)',
            '    _ReadWriteBarrier();',
            '#else',
            '    asm volatile("" : "+r"(back_face_bits));',
            '#endif'
          ) -join "`n")

          $edits = @(
            @{ File = 'YesSteveModel-Native\modules\gfx\src\math\euler.h'; Old = $old1; New = $new1 },
            @{ File = 'YesSteveModel-Native\modules\gfx\src\renderer\cube\transform_avx2.h'; Old = $old2; New = $new2 }
          )
          foreach ($e in $edits) {
            if (-not (Test-Path -LiteralPath $e.File)) { throw "文件不存在：$($e.File)" }
            $text = Get-Content -Raw -LiteralPath $e.File
            if (-not $text.Contains($e.Old)) { throw "未找到待替换内容（上游可能已改动）：$($e.File)" }
            [System.IO.File]::WriteAllText($e.File, $text.Replace($e.Old, $e.New))
            Write-Host "已适配：$($e.File)"
          }
          Write-Host "--- 校验替换结果 ---"
          Select-String -Path 'YesSteveModel-Native\modules\gfx\src\math\euler.h','YesSteveModel-Native\modules\gfx\src\renderer\cube\transform_avx2.h' -Pattern '_ReadWriteBarrier' | ForEach-Object { Write-Host $_.Line.Trim() }

      - name: 恢复 Conan 包缓存
        uses: actions/cache/restore@v4
        with:
          path: YesSteveModel-Native\conan\cache
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-

      - name: Conan 导出配方（bootstrap setup）
        working-directory: YesSteveModel-Native
        shell: pwsh
        run: |
          cmd /c "bootstrap.cmd setup 2>&1" | Tee-Object -FilePath ..\setup-log.txt
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.cmd setup 失败" }

      - name: 打印 Conan profile（诊断）
        continue-on-error: true
        working-directory: YesSteveModel-Native
        shell: pwsh
        run: |
          $env:CONAN_HOME = "$PWD\conan\cache"
          conan profile show -pr:h default 2>&1 | Tee-Object -FilePath ..\profile-log.txt
          exit 0

      - name: 构建 native（编译 30 个依赖，首次较久）
        working-directory: YesSteveModel-Native
        shell: pwsh
        run: |
          Write-Host "开始：$(Get-Date -Format 'HH:mm:ss')"
          cmd /c "bootstrap.cmd build native 2>&1" | Tee-Object -FilePath ..\build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.cmd build native 失败" }
          Write-Host "结束：$(Get-Date -Format 'HH:mm:ss')"

      - name: 校验 ysm.dll
        working-directory: YesSteveModel-Native
        shell: pwsh
        run: |
          $dll = "build\native-release\modules\lib-jni\ysm.dll"
          if (-not (Test-Path $dll)) {
            Get-ChildItem -Recurse -Filter "ysm.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "未找到 $dll"
          }
          $info = Get-Item $dll
          Write-Host ("路径: {0}" -f $info.FullName)
          Write-Host ("大小: {0:N0} 字节" -f $info.Length)
          if ($info.Length -lt 100000) { throw "ysm.dll 体积异常" }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
          Write-Host ("SHA256: {0}" -f $hash)
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
          if ($ascii -notmatch "JNI_OnLoad") { throw "DLL 中未找到 JNI_OnLoad" }
          @("ysm.dll SHA256 = $hash", "size = $($info.Length)") | Set-Content ..\RESULT.txt

      - name: 上传 ysm.dll
        uses: actions/upload-artifact@v4
        with:
          name: ysm-windows-dll
          path: YesSteveModel-Native/build/native-release/modules/lib-jni/ysm.dll
          if-no-files-found: error
          retention-days: 30

      - name: 保存 Conan 包缓存（无论成败）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: YesSteveModel-Native\conan\cache
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}

      - name: 上传日志（始终）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-log.txt
            setup-log.txt
            profile-log.txt
            RESULT.txt
          if-no-files-found: ignore
          retention-days: 14
